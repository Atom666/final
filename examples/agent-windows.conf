[agent]
agent_uuid = 33333333-3333-3333-3333-333333333333
uuid_file = mirror-agent.uuid
capture_iface = \Device\NPF_{REPLACE-WITH-ADAPTER-GUID}
interface_id = 1

receiver_host = 192.168.1.78
receiver_port = 9443
ca_file = ca.crt
client_cert_file = client.crt
client_key_file = client.key
tls_server_name = pt-nad-rt.edtechlab.local
tls_verify_peer = true
insecure_tls = false

ring_blocks = 64
block_size = 1048576
frame_size = 131072
block_timeout_ms = 64
max_capture_frame_size = 65575

queue_max_packets = 65536
queue_max_bytes = 268435456
batch_max_records = 256
batch_max_bytes = 262144
batch_linger_us = 200
transport_write_timeout_sec = 10

offload_policy = observe
segmentation_mode = receiver

reconnect_initial_sec = 1
reconnect_max_sec = 30
heartbeat_interval_sec = 10
stats_interval_sec = 10
log_interval_sec = 10
queue_drop_policy = drop_newest
